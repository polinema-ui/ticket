name: Bug report
description: Report a bug in the Polinema Ticket app (GitHub PR & ticketing workflow)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Describe the bug in the Polinema Ticket ticketing flow (auto-issue linking, PR sync, triage, email notifications, etc.).

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the ticket system is affected?
      multiple: false
      options:
        - ticket create / form
        - ticket list / filter / pagination
        - GitHub webhook / PR sync
        - pixel / loading animation
        - auth / session
        - email notification
        - other
      default: 0
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: Notification email
      description: Email to receive ticket progress notifications (assigned, reviewed, merged/closed). Used for the notification feature you requested.
      placeholder: "your-name@pui.com"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong
      placeholder: "When creating a ticket with GitHub PR link, the status doesn't auto-link…"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Steps to reproduce, ideally with a minimal snippet or repo
      placeholder: |
        1. Go to /tickets/create…
        2. Fill form and paste GitHub PR URL…
        3. Submit…
        4. See that…
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: "Ticket status should become 'In Progress' and send email."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include screenshots or console errors if helpful
      placeholder: "Status stays 'Open'. No error in console."
    validations:
      required: false

  - type: input
    id: versions
    attributes:
      label: Versions
      description: App and environment versions (commit, svelte, vite)
      placeholder: "ticket 0.0.1, svelte 5.56, vite 8.0, bun 1.2"
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser / environment
      description: Browser, OS, or runtime where the bug occurs
      placeholder: "Zen 1.14 on Windows 11, Chrome 126 on macOS"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help (logs, links, workarounds, related PR)
      render: text
    validations:
      required: false
